<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Managa Rental Accommodation</title>

    <meta
    name="description"
    content="Explore accommodation information for students, families and working professionals.">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--Website Header-->

    <header class="site-header">
        <div class="brand">
            <img src="images/managa-house-logo.png"
                 alt="Managa Rental Accommodation">


    <div class="brand-text">
        <span class="brand-name">MANAGA</span>
        <span class="brand-subtitle">RENTAL ACCOMMODATION</span>
    </div>
</header>

    <!--Navigation Menu-->

    <nav class="site-nav">
         <a href="index.html">Home</a> 
        <a href="about.html">About Us</a> 
        <a href="services.html">Services</a> 
        <a href="enquiry.html">Enquiry</a> 
        <a href="contact.html">Contact</a>
        <a href="sitemap.html">Sitemap</a>

    </nav>

    <!--Main Content-->

    <main>

        <h2>Make an Enquiry</h2>

        <p>
            If you are Interested in our accommodation, please complete the form below and provide your details.
        </p>

        <!--Enquiry Form-->

        <form>

    <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" minlength="2" maxlength="80" autocomplete="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9 +()-]{9,20}" title="Please enter a valid 10-digit phone number" autocomplete="tel" required>
    </fieldset>

    <fieldset>
        <legend>Accommodation Details</legend>

        <label for="accommodation">Accommodation Type:</label>
        <select id="accommodation" name="accommodation" required>
            <option value="">Select an option</option>
            <option value="student">Student Accommodation</option>
            <option value="family">Family Accommodation</option>
            <option value="professional">Professional Accommodation</option>
        </select>

        <label for="movein">Preferred Move-in Date:</label>
         <input
            type="date"
            id="movein"
            name="movein"
            required>

        <label for="message">Additional Information</label>
        <textarea
            id="message"
            name="message"
            minlength="10"
            maxlength="1000"
            required></textarea>
    </fieldset>

    <fieldset>
        <legend>Additional Information</legend>

        <label for="message">Message:</label>
        <textarea id="message" name="message"
            placeholder="Tell us about your accommodation requirements..."></textarea>
    </fieldset>

    <input type="submit" value="Submit Enquiry">
    <input type="reset" value="Clear Form">

</form>
  
    </main>

    <!--Footer-->

    <footer>

        <p>
            &copy; 2018 Managa Rental Accommodation
        </p>

    </footer>

    <script src="js/script.js" defer></script>
    
</body>

</html>
